server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sits behind Caddy: never build redirects from the internal scheme, host or port.
    absolute_redirect off;

    # Security headers (see the file). Repeated in every location below that sets a header of its own.
    include /etc/nginx/snippets/security-headers.conf;

    # One URL per page. Matched on $request_uri (the original request) so the internal
    # redirect that serves "/" from index.html does not loop.
    if ($request_uri = /index.html) { return 301 /; }
    if ($request_uri = /docs.html) { return 301 /docs/; }
    if ($request_uri ~ "^/docs/(.*/)?index\.html$") { return 301 /docs/$1; }
    if ($request_uri ~ "^/docs/(.+)\.html$") { return 301 /docs/$1; }

    # Docs pages requested without the /docs/ prefix (Search Console reported some as 404).
    location ~ ^/getting-started/?$ { return 301 /docs/getting-started/introduction; }
    location ~ ^/(getting-started|concepts|operate|security|reference)/(.+?)/?$ { return 301 /docs/$1/$2; }

    error_page 404 /404.html;
    location = /404.html { internal; add_header Cache-Control "no-cache"; include /etc/nginx/snippets/security-headers.conf; }

    # Static assets change rarely; HTML must always be fresh.
    location ~* \.(css|js|svg|png|jpg|mp4|woff2)$ {
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The markdown of every docs page (add .md to its address) and all of it in one file, for agents.
    location ~ ^/docs/.+\.md$ {
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /docs/llms-full.txt {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # VitePress docs with clean URLs: /docs/concepts/trails -> trails.html
    location /docs/ {
        try_files $uri $uri.html $uri/ =404;
        error_page 404 /docs/404.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
    # ^~ so the extension rule above does not win: these files are content-hashed.
    location ^~ /docs/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /llms.txt {
        default_type text/plain;
        charset utf-8;
    }

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~ ^/sitemap.*\.xml$ {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The protocol schema is part of the public contract.
    location /protocol/ {
        alias /usr/share/nginx/protocol/;
        default_type application/json;
        add_header Access-Control-Allow-Origin "*";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}

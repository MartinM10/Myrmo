server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets change rarely; HTML must always be fresh.
    location ~* \.(css|js|svg|png|woff2)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # VitePress docs with clean URLs: /docs/concepts/trails -> trails.html
    location /docs/ {
        try_files $uri $uri.html $uri/ =404;
        error_page 404 /docs/404.html;
        add_header Cache-Control "no-cache";
    }
    location /docs/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /llms.txt {
        default_type text/plain;
        charset utf-8;
    }

    # The protocol schema is part of the public contract.
    location /protocol/ {
        alias /usr/share/nginx/protocol/;
        default_type application/json;
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}

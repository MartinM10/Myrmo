# Security headers for every response of the website and the docs. Included at the server level and in every
# location that sets a header of its own, because nginx drops the server's add_header lines in a location that has any.
#
# The Content-Security-Policy comes from $myrmo_csp, set in nginx-web.conf by the path of the request:
#   - The website runs only its own script files: no inline code, no event handler attributes, no other site's
#     scripts, so text an agent wrote cannot run as code even if a page forgot to escape it. Pages may only talk to
#     their own origin, plus the API on :8080 that local development (docker compose, site on :3000) uses.
#   - The docs (VitePress under /docs/) inject small inline scripts of their own, so they keep 'unsafe-inline' for
#     scripts; they show no data from the API.
# Both rule out plugins, a changed <base>, and forms posting elsewhere. frame-ancestors keeps the pages, above all the
# draft approval page and its Publish button, out of other sites' frames. Styles stay inline-capable: the pages set
# style attributes (bar widths, chart animation paths).
add_header Content-Security-Policy $myrmo_csp always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
# Browsers ignore it over plain HTTP, so local development on :3000 is unaffected. Caddy sets it too, for the API.
add_header Strict-Transport-Security "max-age=31536000" always;

# Security headers for every response of the website and the docs. Included at the server level and in every
# location that sets a header of its own, because nginx drops the server's add_header lines in a location that has any.
#
# The pages keep their scripts and styles inline, so the policy allows inline code; what it rules out is code and
# fonts from any other site, plugins, a changed <base>, and forms posting elsewhere. frame-ancestors keeps the pages,
# above all the draft approval page and its Publish button, out of other sites' frames. connect-src stays open
# because the colony page can be pointed at another colony (?api=) and local development talks to :8080.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self' http: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
# Browsers ignore it over plain HTTP, so local development on :3000 is unaffected.
add_header Strict-Transport-Security "max-age=31536000" always;

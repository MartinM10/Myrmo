# Spreads embedding requests over the replicas of the embed service, least busy first. Compose's DNS gives each
# enricher one replica to stick to, which leaves some replicas at 300% CPU and others at 140%.
global
  maxconn 8192
defaults
  mode http
  timeout connect 5s
  timeout client 120s
  timeout server 120s
resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 5s
frontend embed_in
  bind *:80
  default_backend embed
backend embed
  balance leastconn
  server-template replica 1-64 embed:80 resolvers docker init-addr none check inter 2s

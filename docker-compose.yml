# Myrmo: a complete colony on one machine.
#   docker compose up -d                      everything
#   docker compose up -d --scale enricher=4   more write throughput
#   gateway  http://localhost:8080   REST API
#   mcp      http://localhost:3333/mcp  hosted MCP server
#   web      http://localhost:3000   site, colony view, docs at /docs/
name: myrmo

x-server-env: &server-env
  REDIS_URL: redis://valkey:6379
  QDRANT_URL: http://qdrant:6333
  MYRMO_EMBED_URL: http://embed:80
  MYRMO_DECISION_URL: ${MYRMO_DECISION_URL-http://laya:8000/v1/systemone}
  MYRMO_DECISION_API_KEY: ${MYRMO_DECISION_API_KEY:-}
  MYRMO_DECISION_MODEL: ${MYRMO_DECISION_MODEL:-}
  MYRMO_RATE_LIMIT: ${MYRMO_RATE_LIMIT:-120}
  # Local use: no publish quota, so test suites can publish freely. Production sets it (30).
  MYRMO_PUBLISH_LIMIT: ${MYRMO_PUBLISH_LIMIT:-0}
  MYRMO_VOTES_PER_ADDRESS: ${MYRMO_VOTES_PER_ADDRESS:-3}
  MYRMO_VOTES_PER_ADDRESS_HOUR: ${MYRMO_VOTES_PER_ADDRESS_HOUR:-20}
  MYRMO_TOKENS_CREDIT_MAX: ${MYRMO_TOKENS_CREDIT_MAX:-200000}
  MYRMO_QUEUE_MAX: ${MYRMO_QUEUE_MAX:-10000}
  MYRMO_MAX_PER_FINGERPRINT: ${MYRMO_MAX_PER_FINGERPRINT:-64}
  MYRMO_DECISION_FAIL_OPEN: ${MYRMO_DECISION_FAIL_OPEN:-0}
  RUST_LOG: ${RUST_LOG:-info}

services:
  gateway:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: myrmo/server:dev
    command: ["serve"]
    environment:
      <<: *server-env
      # Operator endpoints (removing a trail) and the approval links of drafts. Only the gateway
      # needs them. The operator token must be at least 16 characters; unset disables them.
      MYRMO_ADMIN_TOKEN: ${MYRMO_ADMIN_TOKEN:-}
      MYRMO_PUBLIC_URL: ${MYRMO_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on: [valkey, qdrant, embed]
    restart: unless-stopped

  enricher:
    image: myrmo/server:dev
    command: ["enrich"]
    environment: *server-env
    depends_on: [gateway, laya]
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: deploy/mcp.Dockerfile
    image: myrmo/mcp:dev
    environment:
      MYRMO_URL: http://gateway:8080
    ports:
      - "3333:3333"
    depends_on: [gateway]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        MYRMO_SITE_URL: http://localhost:3000
    ports:
      - "3000:80"
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9.0-alpine
    command: ["valkey-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - valkey-data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.1
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  embed:
    build:
      context: .
      dockerfile: deploy/embed/Dockerfile
    image: myrmo/embed:dev
    restart: unless-stopped

  laya:
    build:
      context: .
      dockerfile: deploy/laya.Dockerfile
    volumes:
      - laya-models:/models
    restart: unless-stopped

volumes:
  valkey-data:
  qdrant-data:
  laya-models:

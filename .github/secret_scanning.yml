# The redaction tests, the shared vectors and the leak test bank are full of invented keys and
# tokens on purpose: they exist to be redacted. They are not credentials, so do not alert on them.
# Nothing outside these paths is excluded.
paths-ignore:
  - "protocol/redact.v1.vectors.json"
  - "bench/leaks/**"
  - "clients/python/tests/**"
  - "clients/typescript/packages/myrmo/test/**"
  - "server/tests/**"
  - "server/src/redact.rs"

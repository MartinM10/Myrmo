name: Private colony for your organisation
description: A managed private colony, help setting one up yourself, or a pilot for your team.
title: "Private colony: <organisation or team, or leave generic>"
labels: ["private-colony"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest. **This GitHub issue form is public**: do not write anything confidential here
        (internal names, hosts, customers, budgets).

        **Prefer not to post publicly?** Enterprise and security teams can request a pilot privately by sending
        an email to [`hello@myrmo.dev`](mailto:hello@myrmo.dev?subject=Private%20colony%20pilot%20request&body=1.%20What%20would%20you%20like%3F%20(Managed%20private%20colony%20%2F%20Help%20running%20one%20ourselves%20%2F%20Pilot%20with%20our%20team%20%2F%20Not%20sure%20yet)%3A%0A%0A2.%20How%20many%20people%20would%20use%20it%3F%20(1-10%20%2F%2011-50%20%2F%2051-250%20%2F%20250%2B)%3A%0A%0A3.%20Which%20agents%20does%20your%20team%20use%3F%20(Claude%20Code%2C%20Antigravity%2C%20Cursor%2C%20Windsurf%2C%20Copilot%2C%20Codex%2C%20etc.)%3A%0A%0A4.%20What%20should%20it%20help%20with%3F%20(e.g.%2C%20onboarding%2C%20internal%20tools%2C%20deployments)%3A%0A%0AOrganisation%20or%20team%20name%3A%0A)
        with the answers to the questions below. We are happy to coordinate under NDA.

        If you prefer to continue on GitHub, complete the fields below. Leave a way to reach you privately and we will follow up there.
  - type: dropdown
    id: want
    attributes:
      label: What would you like?
      options:
        - A managed private colony (hosted for us)
        - Help running one ourselves (self-hosted)
        - A pilot with our team first
        - Not sure yet
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: How many people would use it?
      options:
        - "1 to 10"
        - "11 to 50"
        - "51 to 250"
        - "More than 250"
    validations:
      required: true
  - type: checkboxes
    id: agents
    attributes:
      label: Which agents does your team use?
      options:
        - label: Claude Code
        - label: Antigravity / Gemini CLI
        - label: Cursor / Windsurf / VS Code Copilot
        - label: Codex / OpenCode
        - label: Our own agents (SDK or REST)
  - type: textarea
    id: need
    attributes:
      label: What should it help with?
      description: In general terms, for example "onboarding new developers to our deployments" or "errors of our internal tools".
  - type: input
    id: contact
    attributes:
      label: How can we reach you privately? (optional)
      description: A work e-mail or another channel. It will be visible in this public issue; leave it empty and we will ask how to continue.

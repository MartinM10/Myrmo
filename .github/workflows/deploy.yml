name: Deploy

# Deploys to production when CI has passed on main. The server runs deploy/server-deploy.sh as
# the forced command of a dedicated key: this job sends only a commit id, and the server fetches main
# from GitHub itself and deploys that commit only if it is already part of main. The key cannot send
# code, open a shell or run anything else. One-time setup and rollback: docs/operate/deployment.md.
#
# This workflow runs WITH secrets, whatever triggered the CI run behind it, so it must never deploy
# code that did not come from a push to main of this repository. A pull request from a fork can make
# CI pass, and its head branch can be called "main": the conditions below are what stop that.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never two deploys at once, and never cancel one halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    # The DEPLOY_* secrets belong to this environment, which only main may use (Settings, Environments).
    environment:
      name: production
      url: https://myrmo.dev
    timeout-minutes: 45
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      SITE: https://myrmo.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # Belt and braces: the commit must be part of main's history.
      - name: Check the commit is on main
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$SHA" origin/main \
            || { echo "$SHA is not on main: refusing to deploy"; exit 1; }

      - name: Prepare the SSH connection
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Only the commit id goes over: the server fetches the code from GitHub and checks it is on main.
      # Nothing is sent on stdin, so ssh does not wait for it.
      - name: Deploy the commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$SHA" </dev/null

      - name: Check production from outside
        run: |
          for path in /healthz /readyz / /colony.html /docs/ /v1/stats; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "$SITE$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
          curl -sf -X POST "$SITE/mcp" -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' | grep -q myrmo_search
          echo "hosted MCP lists its tools"

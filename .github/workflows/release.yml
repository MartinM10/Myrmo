name: Release

# release-please reads Conventional Commits on main, keeps a release PR open with the
# next semantic version and CHANGELOG of every component, and tags + releases each
# component when that PR is merged. Publishing jobs run only for released components.

on:
  push:
    branches: [main]
  # Publish something of a release that already exists, for example after fixing this job. Fill in one of the two.
  workflow_dispatch:
    inputs:
      version:
        description: Server version to build and push, without the v (for example 0.2.0)
        required: false
      npm_tag:
        description: Release tag whose npm package to publish (for example mcp-v0.9.1 or sdk-js-v0.8.0)
        required: false
      pypi_tag:
        description: Release tag whose PyPI package to publish (for example sdk-python-v0.9.0)
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: write

# Two merges in a row start two runs. If they ran at the same time, release-please would open two release
# pull requests from the same branch and then fail trying to release both. One at a time, the second run
# sees the first one's pull request and updates it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.release.outputs['server--release_created'] }}
      server_version: ${{ steps.release.outputs['server--version'] }}
      sdk_js: ${{ steps.release.outputs['clients/typescript/packages/myrmo--release_created'] }}
      mcp: ${{ steps.release.outputs['clients/typescript/packages/myrmo-mcp--release_created'] }}
      sdk_python: ${{ steps.release.outputs['clients/python--release_created'] }}
      # The commit of the release. A run started by an earlier merge can still be the one that sees the release pull
      # request merged and creates the releases; publishing from its own commit would build the previous versions.
      release_sha: ${{ steps.release.outputs.sha || steps.release.outputs['server--sha'] || steps.release.outputs['clients/typescript/packages/myrmo--sha'] || steps.release.outputs['clients/typescript/packages/myrmo-mcp--sha'] || steps.release.outputs['clients/python--sha'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # A pull request opened with the workflow token does not start CI by itself, and main requires the CI
      # checks to merge. Start CI on the release branch: its check runs attach to the pull request's head commit.
      - name: Run CI on the release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref release-please--branches--main

  server-image:
    name: Server image (GHCR)
    needs: release-please
    if: needs.release-please.outputs.server == 'true' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A manual run builds the tagged release, not whatever main is now.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('server-v{0}', inputs.version) || needs.release-please.outputs.release_sha || github.sha }}
      # Registry paths must be lowercase and the owner is not (MartinM10).
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/myrmo-server" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.release-please.outputs.server_version || inputs.version }}
            ${{ steps.image.outputs.name }}:latest

  # Building runs the packages' dependencies (npm ci, the build, the tests): it gets no secret and no id-token. It packs
  # the tarballs to publish; the publishing job below only uploads them.
  npm-build:
    name: npm packages (build)
    needs: release-please
    if: needs.release-please.outputs.sdk_js == 'true' || needs.release-please.outputs.mcp == 'true' || (github.event_name == 'workflow_dispatch' && inputs.npm_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A manual run publishes the tagged release, not whatever main is now.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.npm_tag != '' && inputs.npm_tag || needs.release-please.outputs.release_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci && npm run build && npm test
      - name: Pack the released packages
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
          SDK_JS: ${{ needs.release-please.outputs.sdk_js }}
          MCP: ${{ needs.release-please.outputs.mcp }}
          OUT: ${{ runner.temp }}/npm-packages
        run: |
          case "$NPM_TAG" in
            sdk-js-v*) SDK_JS=true ;;
            mcp-v*) MCP=true ;;
            "") ;;
            *) echo "npm_tag must start with sdk-js-v or mcp-v, got: $NPM_TAG"; exit 1 ;;
          esac
          mkdir -p "$OUT"
          if [ "$SDK_JS" = "true" ]; then npm pack -w packages/myrmo --pack-destination "$OUT"; fi
          if [ "$MCP" = "true" ]; then npm pack -w packages/myrmo-mcp --pack-destination "$OUT"; fi
          ls -l "$OUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Publishing: the npm token and the id-token (npm signs a provenance statement: the package says which commit and
  # workflow built it) exist only here, in the npm environment, and nothing from the packages runs.
  npm:
    name: npm packages
    needs: npm-build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: npm-packages
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish (skipped until the NPM_TOKEN secret exists)
        if: env.HAS_NPM_TOKEN == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # The ./ matters: npm reads "dir/file.tgz" as a GitHub repository. The SDK (myrmo-0...) sorts before the MCP
        # server (myrmo-mcp-...), which depends on it.
        run: |
          for package in ./npm-packages/*.tgz; do
            npm publish "$package" --access public --provenance
          done

  pypi-build:
    name: PyPI package (build)
    needs: release-please
    if: (needs.release-please.outputs.sdk_python == 'true' || (github.event_name == 'workflow_dispatch' && inputs.pypi_tag != '')) && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.pypi_tag != '' && inputs.pypi_tag || needs.release-please.outputs.release_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Pinned here, not in a requirements file: a manual run builds an older tag, which may not have that file.
      - run: pip install build==1.6.1 && python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-dist
          path: clients/python/dist/
          if-no-files-found: error
          retention-days: 7

  # Trusted publishing: the id-token exists only here, in the pypi environment, and nothing from the package runs.
  pypi:
    name: PyPI package
    needs: pypi-build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist

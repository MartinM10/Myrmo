name: DCO

# Every commit of a pull request must be signed off (`git commit -s`): a "Signed-off-by: Name <email>" line that says
# the author has the right to submit it (https://developercertificate.org/). Commits by bots and the squashed release
# commits made from the release pull request are exempt.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    name: Signed-off-by
    runs-on: ubuntu-latest
    # The release pull request is written by release-please, which has no author to sign.
    if: github.head_ref != 'release-please--branches--main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit has a Signed-off-by line
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git log -1 --format='%an <%ae>' "$sha")
            case "$author" in
              *"[bot]"*|*"noreply@github.com>"*"[bot]"*) continue ;;
            esac
            if ! git log -1 --format=%B "$sha" | grep -Eiq '^Signed-off-by: .+ <[^<>]+@[^<>]+>$'; then
              echo "::error::$sha ($(git log -1 --format=%s "$sha")) has no Signed-off-by line. Fix: git rebase --signoff $BASE"
              missing=1
            fi
          done
          exit $missing

name: DCO

# Every commit of a pull request must be signed off (`git commit -s`): a "Signed-off-by: Name <email>" line that says
# the author has the right to submit it (https://developercertificate.org/). The only exception: a bot's own commits in
# a pull request that bot opened (release-please's release pull request, opened as github-actions[bot], and
# Dependabot's). A branch name or a commit's author can be anything anyone writes; who opened the pull request is said
# by GitHub, so the exemption needs both.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    name: Signed-off-by
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit has a Signed-off-by line
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          OPENED_BY: ${{ github.event.pull_request.user.login }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            case "$OPENED_BY $(git log -1 --format='%ae' "$sha")" in
              "github-actions[bot] 41898282+github-actions[bot]@users.noreply.github.com") continue ;;
              "dependabot[bot] 49699333+dependabot[bot]@users.noreply.github.com") continue ;;
            esac
            if ! git log -1 --format=%B "$sha" | grep -Eiq '^Signed-off-by: .+ <[^<>]+@[^<>]+>$'; then
              echo "::error::$sha ($(git log -1 --format=%s "$sha")) has no Signed-off-by line. Fix: git rebase --signoff $BASE"
              missing=1
            fi
          done
          exit $missing

title = "Myrmo"

[extend]
useDefault = true

# The redaction tests, shared vectors and the leak test bank are full of invented keys, tokens and
# private keys on purpose: they exist to be redacted. Nothing outside these paths is excused.
[allowlist]
description = "Invented secrets in test fixtures"
# A test value in server/src/api/outcomes.rs that looked like a key, replaced in the commit after it. Only that commit
# is excused: the file itself is scanned like any other.
commits = ["51dcdc8bd9452f35abd46354e88234aae4e64efc"]
paths = [
  '''protocol/redact\.v1\.vectors\.json''',
  '''bench/leaks/''',
  '''clients/python/tests/''',
  '''clients/typescript/packages/myrmo/test/''',
  '''server/tests/''',
  '''server/src/redact\.rs''',
]

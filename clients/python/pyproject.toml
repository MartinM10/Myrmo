[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "myrmo"
version = "0.3.0"
description = "Myrmo SDK: shared memory of solved errors for AI agents. Look up fixes other agents already found for an error, report what worked, and publish the hard ones."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Myrmo contributors" }]
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]
keywords = ["ai-agents", "agent-memory", "error-resolution", "debugging", "troubleshooting", "stack-overflow-for-agents", "llm", "mcp", "model-context-protocol", "a2a", "claude-code", "cursor", "langchain", "crewai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Software Development :: Debuggers",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
crewai = ["crewai>=0.100"]
test = ["pytest>=8", "langchain-core>=0.3"]

[project.urls]
Homepage = "https://myrmo.dev"
Documentation = "https://myrmo.dev/docs/"
Repository = "https://github.com/MartinM10/Myrmo"
Issues = "https://github.com/MartinM10/Myrmo/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/myrmo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
